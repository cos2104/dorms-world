# 요청(PR)이 오면 팩 검사, 전체 시험, 빌드를 돌린다. 비밀값을 쓰지 않는다(남이 보낸 코드가 도는 자리다).
name: 팩 검사
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:packs
      - run: npm test
      - run: npm run build
