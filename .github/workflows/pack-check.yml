# 요청(PR)이 오면 팩 검사, 전체 시험, 빌드를 돌린다. 비밀값을 쓰지 않는다(남이 보낸 코드가 도는 자리다).
name: 팩 검사
on:
  pull_request:
  workflow_dispatch:   # '승인된 팩 싣기'가 자기가 연 요청의 가지에서 직접 돌린다
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # 선생님들은 윈도우에서도 검사와 보내기를 돌린다. 경로 처리 같은 운영체제 차이를 여기서 잡는다
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:packs
      - run: npm test
      - run: npm run build
      - run: npm run check:security   # 도름스체크(코드만). 걸린 것이 있으면 멈춘다
